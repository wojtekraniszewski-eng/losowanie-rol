<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Losowanie ról</title>

    <!-- Firebase v9+ modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, getDoc, runTransaction, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // Konfiguracja Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAzRAl4V4DjPtcZzIQ4enH423_0md_DF9Q",
            authDomain: "losowanie-4ee95.firebaseapp.com",
            projectId: "losowanie-4ee95",
            storageBucket: "losowanie-4ee95.firebasestorage.app",
            messagingSenderId: "166958327922",
            appId: "1:166958327922:web:9b6e05604cf20bfe853aeb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lista ról (bez Nauczyciela, Obserwator x2)
        const listaRól = ["Obserwator", "Obserwator", "Psycholog", "Rodzic", "Dziecko"];

        // Funkcja losująca rolę
        window.losuj = async function() {
            const ref = doc(db, "role", "lista");

            try {
                await runTransaction(db, async (transaction) => {
                    const docSnap = await transaction.get(ref);

                    let role;
                    // jeśli dokument nie istnieje lub lista pusta → reset
                    if (!docSnap.exists() || docSnap.data().role.length === 0) {
                        role = [...listaRól];
                        transaction.set(ref, { role });
                        document.getElementById("wynik").innerText = "Lista została zresetowana! Kliknij jeszcze raz, aby wylosować rolę.";
                        return;
                    } else {
                        role = docSnap.data().role;
                    }

                    // Losowanie roli
                    const index = Math.floor(Math.random() * role.length);
                    const wylosowana = role[index];

                    // Usuń wylosowaną rolę
                    role.splice(index, 1);

                    // Zapisz zmienioną listę w transakcji
                    transaction.update(ref, { role });

                    // Wyświetl wynik
                    document.getElementById("wynik").innerText = "Twoja rola: " + wylosowana;
                });
            } catch (err) {
                console.error("Błąd transakcji: ", err);
                document.getElementById("wynik").innerText = "Wystąpił błąd, spróbuj ponownie.";
            }
        };
    </script>
</head>
<body>

<h1>Losowanie ról</h1>
<button onclick="losuj()">Losuj rolę</button>
<h2 id="wynik"></h2>

</body>
</html>
